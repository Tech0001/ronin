name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GTK / WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            ripgrep

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend and run unit tests
        run: npm run build && npm test

      - name: Run Rust workspace tests
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml

      - name: Build and package Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm run build:release
          npm run package:linux

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber \
              release/ronin-*.tar.gz \
              release/SHA256SUMS.txt
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Ronin ${GITHUB_REF_NAME}" \
              --generate-notes \
              release/ronin-*.tar.gz \
              release/SHA256SUMS.txt
          fi
