name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GTK / WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            ripgrep

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify tag matches package.json version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"

      - run: npm ci
      - run: npm run build && npm test
      - run: cargo test --workspace --manifest-path src-tauri/Cargo.toml

  draft:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Ronin ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            platform: macos
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci
      - run: npm run build

      - name: Build and prepare ronin-daemon sidecar
        run: node scripts/prepare-daemon-sidecar.mjs --target ${{ matrix.target }}

      - name: Build Linux tarball and .deb
        if: matrix.platform == 'linux'
        run: |
          npx tauri build --ci --target ${{ matrix.target }} --bundles deb --features custom-protocol --config src-tauri/tauri.release.conf.json
          mkdir -p upload
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb upload/
          # Also assemble portable .tar.gz
          mkdir -p src-tauri/target/release
          cp src-tauri/target/${{ matrix.target }}/release/ronin src-tauri/target/release/ronin
          cp src-tauri/target/${{ matrix.target }}/release/ronin-daemon src-tauri/target/release/ronin-daemon
          bash scripts/package-linux.sh
          cp release/ronin-*-linux-*.tar.gz upload/

      - name: Build macOS .dmg
        if: matrix.platform == 'macos'
        run: |
          npx tauri build --ci --target ${{ matrix.target }} --bundles dmg --features custom-protocol --config src-tauri/tauri.release.conf.json
          mkdir -p upload
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg upload/

      - name: Build Windows installers (.exe & .msi)
        if: matrix.platform == 'windows'
        run: |
          npx tauri build --ci --target ${{ matrix.target }} --bundles nsis,msi --features custom-protocol --config src-tauri/tauri.release.conf.json
          mkdir -p upload
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe upload/
          cp src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi upload/

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh upload/
          gh release upload "$GITHUB_REF_NAME" upload/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate SHA256SUMS and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sums && cd sums
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern '*.deb' --pattern '*.pkg.tar.zst' --pattern '*.dmg' --pattern '*.exe' --pattern '*.msi'
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
