[package]
name = "ronin-daemon"
version = "1.0.0"
description = "Detached pure-Rust PTY persistence daemon for Ronin"
edition = "2021"

[dependencies]
dirs = "6"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros", "signal"] }
uuid = { version = "1", features = ["v4"] }
vt100 = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
