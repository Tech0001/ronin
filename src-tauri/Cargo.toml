[workspace]
members = [".", "daemon"]

[package]
name = "ronin"
version = "1.1.1"
description = "Lightweight Rust + Tauri desktop workspace for persistent terminal and AI agent panels"
repository = "https://github.com/Tech0001/ronin"
license = "MIT"
authors = ["Ronin contributors"]
edition = "2021"
default-run = "ronin"

[lib]
name = "ronin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
base64 = "0.22"
dirs = "6"
notify = "8.2.0"
ronin-daemon = { path = "daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
